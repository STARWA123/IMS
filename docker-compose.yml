services:
  offertrack:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    container_name: offertrack-prod
    restart: unless-stopped
    init: true
    env_file:
      - ${OFFERTRACK_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${OFFERTRACK_DATA_DIR:-./data}:/app/data
      - ${OFFERTRACK_BACKUP_DIR:-./backups}:/app/backups
    mem_limit: 1200m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
